[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-mcp-rw"
version = "0.1.0"
description = "A read-write MCP server for NetBox"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.3.0",
    "requests>=2.31.0",
]

[project.scripts]
netbox-mcp-rw = "server:main"

[tool.setuptools]
py-modules = ["server", "netbox_client"]
